name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Collect ffmpeg
        run: |
          Copy-Item (Get-Command ffmpeg).Source .
          Copy-Item (Get-Command ffprobe).Source .
      - name: Build
        run: pyinstaller --noconfirm --windowed --name HinglishCaptioner --collect-all faster_whisper --collect-all ctranslate2 --collect-all indic_transliteration --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." app.py
      - name: Zip
        run: Compress-Archive -Path dist\HinglishCaptioner -DestinationPath HinglishCaptioner-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HinglishCaptioner-windows
          path: HinglishCaptioner-windows.zip  
